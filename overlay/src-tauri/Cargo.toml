[package]
name = "companion-overlay"
version = "0.1.0"
edition = "2021"
description = "Always-On AI Companion — floating coaching-card overlay (Tauri v2, no npm)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
